name: CI

on:
  push:
    branches: [main]
  pull_request:

# um push novo na mesma branch cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # banco real para os testes de integração da memória de erros
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tutor -d tutor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tutor:tutor@localhost:5432/tutor
      # também testa o modelo de embeddings de verdade (baixado na primeira vez)
      RUN_MODEL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # mesma versão da imagem Docker do back-end
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # os testes não chamam o Groq nem o Firebase: não precisam de segredos do projeto
      - run: pytest

  frontend:
    name: Front (tipos e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc -b + vite build
      - run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagem do back-end
        run: docker build -t english-tutor-api ./backend
      - name: Imagem do front
        run: docker build -t english-tutor-web .
      - name: Back-end sobe e responde
        run: |
          docker run -d --name api -p 8000:8000 english-tutor-api
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

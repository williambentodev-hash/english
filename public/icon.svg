<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- fundo de ponta a ponta: o Android recorta no formato do aparelho (ícone "maskable") -->
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- "T" dentro da área segura central -->
  <rect x="166" y="170" width="180" height="40" rx="12" fill="#fff" />
  <rect x="236" y="170" width="40" height="180" rx="12" fill="#fff" />
</svg>
